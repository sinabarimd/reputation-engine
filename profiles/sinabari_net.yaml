site: sinabari.net
role: AI authority node (physician-technologist perspective)
objective: Build topical authority for AI broadly and healthcare AI specifically,
  supporting branded queries related to AI leadership and physician-technologist identity.
positioning: Thought leadership hub for AI from a physician-executive perspective.
  Healthcare AI is the core but broader AI topics (ethics, governance, resource costs,
  labor, alignment, policy) are welcome when the author has genuine perspective.
allowed_topics:
- AI ethics, governance, and policy
- AI resource costs and sustainability (energy, water, labor)
- AI data labor and supply chain ethics
- LLMs, foundation models, and AI safety
- healthcare AI and clinical workflows
- AI adoption in health systems
- medical imaging and diagnostics AI
- AI in creative and knowledge work
- physician-technologist identity and AI builder ethics
- digital health platforms and health data
forbidden_topics:
- plastic surgery education
- beauty or aesthetics advice
- local practice or patient acquisition pages
- shallow prompt-engineering listicles
- vendor press releases or product reviews
primary_keywords:
- Sina Bari AI
- AI ethics physician
- healthcare AI thought leadership
- Sina Bari healthcare AI
content_types:
- pillar pages
- research-backed blog posts
- case-study style articles
- op-eds
- talk summaries
core_pages:
- /
- /about
- /topics/healthcare-ai
- /topics/clinical-workflows
- /writing
- /speaking
linking_rules:
  inbound_priority: Secondary node; receives links from canonical site and AI-relevant
    Web 2.0 profiles.
  outbound:
  - Link prominently to sinabarimd.com as official personal site
  - Link to drsinabari.com only when an essay format is the better destination
  anchor_guidance:
  - Sina Bari, MD
  - official profile
  - healthcare AI
  - AI ethics
schema:
- Person
- WebSite
- Blog
- Article
agent:
  name: ai-authority-agent
  job: Publish high-trust AI content from a physician-technologist perspective without
    drifting into aesthetics or generic personal branding.
  approval_required_for:
  - new pillar pages
